<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#14181F">
<title>NOTAS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#14181F;
    --surface:#1B212B;
    --surface-2:#222936;
    --ink:#EDEFF2;
    --ink-dim:#9AA3B2;
    --amber:#E8A33D;
    --line:#2A3240;
    --on-amber:#1A140A;
    --header-bg:rgba(20,24,31,0.94);
    --ink-body:#C7CDD8;
    --ink-body-2:#DCE0E8;
    --chip-bg:rgba(255,255,255,0.06);
    --pill-line:rgba(255,255,255,0.14);
    --shadow:0 1px 2px rgba(0,0,0,.25);
    --mono: ui-monospace, "SF Mono", "Menlo", monospace;
    --sans: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    /* colores de nota (tema oscuro) */
    --nc-bone:#1B212B; --nc-sage:#1E2A23; --nc-arena:#2A2519; --nc-rosa:#2C1F1E;
    --nc-cielo:#1A2533; --nc-lila:#241F31; --nc-menta:#182A25; --nc-ocre:#2B2414;
  }
  /* Tema claro estilo Bitácora */
  :root[data-theme="light"]{
    --bg:#F2F5F0;
    --surface:#FFFFFF;
    --surface-2:#E9EEE8;
    --ink:#16221D;
    --ink-dim:#6E7B74;
    --amber:#2C5F4A;
    --line:#DCE3DB;
    --on-amber:#FFFFFF;
    --header-bg:rgba(242,245,240,0.94);
    --ink-body:#3D4B44;
    --ink-body-2:#2A3731;
    --chip-bg:rgba(22,34,29,0.06);
    --pill-line:rgba(22,34,29,0.14);
    --shadow:0 1px 2px rgba(22,34,29,.06), 0 6px 18px rgba(22,34,29,.05);
    --nc-bone:#FFFFFF; --nc-sage:#E3EBE1; --nc-arena:#F3E9D6; --nc-rosa:#F3E1DC;
    --nc-cielo:#DFE9F1; --nc-lila:#E7E1F1; --nc-menta:#DBEBE2; --nc-ocre:#EFE4C9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding-bottom:24px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--header-bg); backdrop-filter:blur(8px);
    padding:14px 14px 10px; border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .brand-left{ display:flex; align-items:baseline; gap:8px; }
  .brand .badge{ width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber);}
  .brand h1{ font-size:15px; font-weight:600; letter-spacing:0.04em; margin:0; font-family:var(--mono); color:var(--ink);}
  .version-tag{ font-size:9.5px; color:var(--amber); font-weight:400; vertical-align:middle; opacity:0.85; }
  .brand .updated{ font-size:10px; color:var(--ink-dim); font-family:var(--mono);}
  .refresh-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--ink-dim);
    font-size:11px; font-family:var(--mono); padding:6px 9px; border-radius:8px;
    display:flex; align-items:center; gap:5px;
  }
  .refresh-btn:active{ background:var(--surface-2); }
  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:10px;
  }
  .search input{
    background:none; border:none; outline:none; color:var(--ink);
    font-size:14px; width:100%; font-family:var(--sans);
  }
  .search input::placeholder{ color:var(--ink-dim); }
  .search svg{flex-shrink:0; opacity:0.5;}

  .maintabs{ display:flex; gap:6px; margin-bottom:8px; }
  .maintab{
    flex:1; text-align:center; font-family:var(--mono); font-size:12px; padding:8px 10px;
    border-radius:8px; border:1px solid var(--line); color:var(--ink-dim); background:var(--surface);
  }
  .maintab.active{ background:var(--amber); color:var(--on-amber); border-color:var(--amber); font-weight:600;}

  .subtabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .subtabs::-webkit-scrollbar{ display:none; }
  .subtab{
    flex-shrink:0; font-family:var(--mono); font-size:11px; padding:5px 10px;
    border-radius:7px; border:1px solid var(--line); color:var(--ink-dim); background:var(--surface);
    white-space:nowrap;
  }
  .subtab.active{ background:var(--surface-2); color:var(--amber); border-color:var(--amber); }

  main{ padding:12px 14px 90px; }

  .notas-list{ display:flex; flex-direction:column; gap:10px; }
  .note-row{ display:flex; align-items:stretch; gap:0; touch-action:pan-y; }
  .note-row.dragging{ opacity:0.85; }
  .note-row .card{ flex:1; margin-bottom:0; }
  .drag-handle{
    flex-shrink:0; width:34px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-dim); font-size:18px; letter-spacing:-2px; cursor:grab; touch-action:none;
  }
  .drag-handle:active{ cursor:grabbing; color:var(--amber); }
  .note-row-placeholder{
    border:1.5px dashed var(--line); border-radius:12px; background:rgba(255,255,255,0.02);
  }

  .card{
    break-inside:avoid; margin-bottom:10px; border-radius:12px;
    border:1px solid var(--line); padding:12px; position:relative; overflow:hidden;
    background:var(--surface); cursor:pointer;
  }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:#4A5468;}
  .card .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; margin-bottom:6px; flex-wrap:wrap;}
  .card .ent{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.03em; }
  .card .code{ font-family:var(--mono); font-size:10px; color:var(--ink-dim); }
  .card .title{ font-size:13.5px; font-weight:600; margin:0 0 4px; color:var(--ink);}
  .card .body{
    font-size:12.5px; line-height:1.5; color:var(--ink-body); word-break:break-word;
    max-height:57px; overflow:hidden;
  }
  .card .body p, .card .body div, .fv-body p, .fv-body div{ margin:0; }
  .card .body ul, .card .body ol{ margin:0; padding-left:18px; }
  .fv-body ul, .fv-body ol{ margin:4px 0; padding-left:22px; }
  .card .meta{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; flex-wrap:wrap; gap:4px;}
  .card .date{ font-size:10px; color:var(--ink-dim); font-family:var(--mono); }
  .card .chips{ display:flex; gap:4px; flex-wrap:wrap; }
  .card .chip{
    font-size:9.5px; font-family:var(--mono); padding:2px 6px; border-radius:5px;
    background:var(--chip-bg); color:var(--ink-dim);
  }
  .local-badge{ font-size:10.5px; color:var(--amber); font-family:var(--mono); margin-left:5px; }

  /* entity colors */
  .ce-bbva::before{background:#3E7BFA;} .ce-bbva .ent{color:#3E7BFA;}
  .ce-cajamar::before{background:#6EC46B;} .ce-cajamar .ent{color:#6EC46B;}
  .ce-caixa::before{background:#E86A6A;} .ce-caixa .ent{color:#E86A6A;}
  .ce-orange::before{background:#E8A33D;} .ce-orange .ent{color:#E8A33D;}
  .ce-abanca::before{background:#B07EEA;} .ce-abanca .ent{color:#B07EEA;}
  .ce-repsol::before{background:#FF7A1A;} .ce-repsol .ent{color:#FF7A1A;}
  .ce-sprinter::before{background:#F27EB0;} .ce-sprinter .ent{color:#F27EB0;}
  .ce-dia::before{background:#E23744;} .ce-dia .ent{color:#E23744;}
  .ce-march::before{background:#8FA8E8;} .ce-march .ent{color:#8FA8E8;}
  .ce-jd::before{background:#9BD97D;} .ce-jd .ent{color:#9BD97D;}

  .empty{
    margin:60px 20px; text-align:center; color:var(--ink-dim);
  }
  .empty .icon{ font-size:36px; margin-bottom:10px; }
  .empty h2{ font-size:15px; color:var(--ink); font-family:var(--mono); margin:0 0 6px;}
  .empty p{ font-size:12.5px; line-height:1.5; margin:0 0 18px; }
  .bigbtn{
    background:var(--amber); color:var(--on-amber); border:none; font-weight:700;
    font-family:var(--mono); font-size:13px; padding:12px 20px; border-radius:10px;
  }
  .no-results{ text-align:center; color:var(--ink-dim); font-size:12.5px; font-family:var(--mono); padding:40px 20px;}

  #fileInputLibreta, #fileInputPropio{ display:none; }

  .fab{
    position:fixed; right:18px; bottom:22px; width:54px; height:54px; border-radius:50%;
    background:var(--amber); color:var(--on-amber); font-size:28px; font-weight:700; border:none;
    box-shadow:0 6px 16px rgba(0,0,0,0.45); z-index:30; display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .fab:active{ transform:scale(0.95); }

  .fullview{
    position:fixed; inset:0; background:var(--bg); z-index:50;
    display:flex; flex-direction:column; animation:fv-in 0.16s ease-out;
  }
  @keyframes fv-in{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
  .fv-header{
    display:flex; align-items:center; gap:12px; padding:14px 14px 12px;
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .fv-back{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    width:34px; height:34px; border-radius:9px; font-size:16px; flex-shrink:0;
  }
  .fv-back:active{ background:var(--surface-2); }
  .fv-pencil{
    margin-left:auto; background:var(--surface); border:1px solid var(--line); color:var(--ink);
    width:34px; height:34px; border-radius:9px; font-size:15px; flex-shrink:0;
  }
  .fv-headtext{ min-width:0; }
  .fv-ent{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.03em; }
  .fv-sub{ font-size:10.5px; color:var(--ink-dim); font-family:var(--mono); margin-top:1px;}
  .fv-scroll{ flex:1; overflow-y:auto; padding:18px 18px 40px; }
  .fv-title{ font-size:19px; font-weight:700; margin:0 0 14px; line-height:1.35; }
  .fv-body{ font-size:15px; line-height:1.7; color:var(--ink-body-2); word-break:break-word; }
  .fv-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:22px; padding-top:14px; border-top:1px solid var(--line); }
  .fv-chip{
    font-size:11px; font-family:var(--mono); padding:4px 9px; border-radius:6px;
    background:var(--chip-bg); color:var(--ink-dim);
  }
  .fv-date{ font-size:11px; color:var(--ink-dim); font-family:var(--mono); margin-top:22px; }

  /* ---- Editor estilo Keep ---- */
  .editor-scroll{ flex:1; overflow-y:auto; padding:6px 18px 24px; }
  .ek-title{
    width:100%; background:none; border:none; outline:none; color:var(--ink);
    font-size:22px; font-weight:700; font-family:var(--sans); padding:14px 0 10px;
    line-height:1.3;
  }
  .ek-title::placeholder{ color:var(--ink-dim); opacity:0.55; }
  .ek-divider{ height:1px; background:var(--line); margin:2px 0 6px; }
  .ek-body{
    width:100%; background:none; border:none; outline:none; color:var(--ink-body-2);
    font-size:16px; line-height:1.7; font-family:var(--sans); padding:8px 0;
    min-height:180px; resize:none;
  }
  .ek-body::placeholder{ color:var(--ink-dim); opacity:0.55; }
  /* fila de campos cortos (entidad, código...) tipo "meta" discretos */
  .ek-metafield{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(42,50,64,0.6); }
  .ek-metafield label{
    font-size:10.5px; font-family:var(--mono); color:var(--ink-dim);
    min-width:78px; flex-shrink:0; text-transform:uppercase; letter-spacing:0.03em;
  }
  .ek-metafield input{
    flex:1; background:none; border:none; outline:none; color:var(--ink);
    font-size:15px; font-family:var(--sans);
  }
  .ek-metafield input::placeholder{ color:var(--ink-dim); opacity:0.4; }
  .ek-section-label{ font-size:10px; font-family:var(--mono); color:var(--ink-dim); letter-spacing:0.05em; margin:18px 0 2px; text-transform:uppercase; opacity:0.75;}

  .editor-actions{
    display:flex; gap:10px; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--bg); flex-shrink:0;
  }
  .editor-save{
    flex:1; background:var(--amber); color:var(--on-amber); border:none; font-weight:700;
    font-family:var(--mono); font-size:14px; padding:13px; border-radius:11px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .editor-cancel-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--mono); font-size:14px; padding:13px 18px; border-radius:11px;
  }
  .editor-delete-btn{
    background:var(--surface); border:1px solid var(--line); color:#E86A6A;
    font-family:var(--mono); font-size:15px; padding:13px 15px; border-radius:11px; flex-shrink:0;
  }

  .excel-modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .excel-modal{
    background:var(--surface); border:1px solid var(--line); border-radius:16px 16px 0 0;
    width:100%; max-width:480px; padding:18px; padding-bottom:28px;
  }
  .excel-modal h3{ font-size:13px; font-family:var(--mono); color:var(--ink-dim); margin:0 0 14px; text-align:center; letter-spacing:0.05em;}
  .excel-option{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:13px 14px; margin-bottom:9px; color:var(--ink); font-size:13.5px;
  }
  .excel-option .eo-icon{ font-size:18px; flex-shrink:0; }
  .excel-option .eo-text small{ display:block; color:var(--ink-dim); font-size:10.5px; font-family:var(--mono); margin-top:2px; font-weight:400; }
  .excel-cancel{
    width:100%; text-align:center; background:none; border:none; color:var(--ink-dim);
    font-family:var(--mono); font-size:12.5px; padding:10px; margin-top:4px;
  }

  /* ===== Botones cabecera ===== */
  .head-btns{ display:flex; gap:6px; align-items:center; }
  .theme-btn{ padding:6px 9px; font-size:13px; }

  /* ===== Notas en mosaico (estilo Bitácora) ===== */
  .n-seccion{ font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--ink-dim); margin:2px 0 9px 2px; }
  .mosaico{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:10px;
    grid-auto-rows:2px; align-items:start; margin-bottom:8px; }
  @media (min-width:640px){ .mosaico{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .nwrap{ min-width:0; }
  .nota{ border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    padding:11px 12px 10px; position:relative; cursor:pointer; color:var(--ink);
    transition:transform .12s, box-shadow .12s, opacity .12s; }
  .nota .n-tit{ font-weight:600; font-size:14px; line-height:1.3; margin-bottom:4px;
    word-break:break-word; padding-right:18px; }
  .nota .n-txt{ font-size:13px; line-height:1.45; color:var(--ink-body); word-break:break-word;
    max-height:170px; overflow:hidden; }
  .nota .n-txt.corta{ -webkit-mask-image:linear-gradient(#000 72%, transparent); mask-image:linear-gradient(#000 72%, transparent); }
  .n-txt p, .n-txt div{ margin:0; }
  .n-txt ul, .n-txt ol{ margin:2px 0; padding-left:18px; }
  .n-txt h1, .n-txt h2, .n-txt h3{ font-size:1.1em; margin:2px 0; }
  .nota .n-pie{ display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; padding-right:22px; }
  .nota .n-eti{ font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-dim); border:1px solid var(--pill-line); border-radius:99px; padding:1px 7px; background:none; }
  .nota .n-fec{ font-family:var(--mono); font-size:9.5px; color:var(--ink-dim); }
  .nota .n-loc{ font-family:var(--mono); font-size:10px; color:var(--amber); }
  .n-pin{ position:absolute; top:6px; right:6px; width:24px; height:24px; display:grid; place-items:center;
    border-radius:6px; opacity:.32; background:none; border:none; padding:0; }
  .n-pin svg{ width:13px; height:13px; stroke:var(--ink); stroke-width:1.8; fill:none; }
  .nota.fija .n-pin{ opacity:1; }
  .nota.fija .n-pin svg{ fill:var(--ink); }
  .n-asa{ position:absolute; bottom:3px; right:3px; width:30px; height:30px; display:grid; place-items:center;
    opacity:.35; touch-action:none; cursor:grab; }
  .n-asa svg{ width:13px; height:13px; stroke:var(--ink); stroke-width:1.9; fill:none; }
  .nota.llevando{ opacity:.55; transform:scale(.96); box-shadow:0 10px 24px rgba(0,0,0,.25); z-index:5; }
  .nota.destino{ outline:2px dashed var(--amber); outline-offset:2px; }
  /* lista dentro de la tarjeta */
  .n-lista{ margin-top:2px; }
  .n-li{ display:flex; align-items:flex-start; gap:7px; padding:3px 0; width:100%; text-align:left;
    background:none; border:none; color:inherit; font:inherit; }
  .n-li i{ flex:none; width:14px; height:14px; border-radius:4px; border:1.4px solid var(--ink-dim);
    margin-top:2px; display:grid; place-items:center; }
  .n-li i::after{ content:""; width:6px; height:3px; border-left:1.8px solid #fff; border-bottom:1.8px solid #fff;
    transform:rotate(-45deg) translateY(-1px); opacity:0; }
  .n-li.ok i{ background:var(--amber); border-color:var(--amber); }
  .n-li.ok i::after{ opacity:1; }
  .n-li span{ font-size:12.5px; line-height:1.35; word-break:break-word; color:var(--ink-body); }
  .n-li.ok span{ text-decoration:line-through; color:var(--ink-dim); }
  .n-mas{ font-family:var(--mono); font-size:9.5px; color:var(--ink-dim); margin-top:4px; display:block; }

  /* clases de formato que vienen de Libreta (Quill) */
  .ql-size-small{ font-size:.75em; }
  .ql-size-large{ font-size:1.4em; }
  .ql-size-huge{ font-size:1.9em; }
  .ql-font-cursiva{ font-family:Georgia, serif; font-style:italic; }
  li[data-list="bullet"]{ list-style-type:disc; }

  /* ===== Editor de nota a pantalla completa ===== */
  .neditor{ background:var(--nc-bone); }
  .ne-top{ display:flex; align-items:center; gap:6px; padding:calc(8px + env(safe-area-inset-top)) 10px 8px; flex:none; }
  .ne-sp{ flex:1; }
  .ne-ico{ width:38px; height:38px; border-radius:10px; display:grid; place-items:center; background:none;
    border:1px solid transparent; color:var(--ink); font-size:17px; padding:0; }
  .ne-ico svg{ width:19px; height:19px; stroke:var(--ink); stroke-width:1.8; fill:none; }
  .ne-ico[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
  .ne-ico[aria-pressed="true"] svg{ stroke:var(--bg); fill:var(--bg); }
  .ne-ico[aria-pressed="false"]{ opacity:.5; }
  .ne-ico.ok{ background:var(--amber); color:var(--on-amber); font-weight:700; }
  .ne-ico.borrar{ color:#E86A6A; }
  .ne-tit{ border:none; background:none; outline:none; color:var(--ink); font-family:var(--sans);
    font-weight:700; font-size:22px; padding:4px 18px 8px; flex:none; width:100%; }
  .ne-tit::placeholder{ color:var(--ink-dim); opacity:.55; }
  .ne-tools{ display:flex; gap:2px; padding:0 12px 6px; flex:none; overflow-x:auto; scrollbar-width:none; }
  .ne-tools::-webkit-scrollbar{ display:none; }
  .ne-tools button{ flex:none; min-width:36px; height:34px; border-radius:8px; padding:0 8px; background:none;
    border:none; font-size:15px; color:var(--ink); display:grid; place-items:center; }
  .ne-tools button:active{ background:var(--chip-bg); }
  .ne-tools .b{ font-weight:800; } .ne-tools .i{ font-style:italic; }
  .ne-tools .u{ text-decoration:underline; } .ne-tools .s{ text-decoration:line-through; }
  .ne-sepv{ width:1px; background:var(--line); margin:6px 5px; flex:none; }
  .ne-body{ flex:1; overflow-y:auto; padding:4px 18px 24px; outline:none; font-size:16px; line-height:1.55;
    color:var(--ink-body-2); word-break:break-word; }
  .ne-body:empty::before{ content:attr(data-ph); color:var(--ink-dim); opacity:.55; }
  .ne-body p, .ne-body div{ margin:0; }
  .ne-body ul, .ne-body ol{ padding-left:22px; margin:6px 0; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===================== ESTADO ===================== */
// Dos capas independientes:
// - LIBRETA: lo importado desde el Excel maestro de PycLibreta (base de solo lectura)
// - NOTAS_PROPIO: lo creado/editado aquí mismo, por id. Siempre gana sobre LIBRETA al fusionar.
var LIBRETA = { notas: [], info: [], updated: null };
var NOTAS_PROPIO = { notas: {}, info: {}, updated: null };
var STATE = { mainTab: 'notas', subEntidad: 'Todo', subEtiqueta: 'Todas', query: '' };

var LIBRETA_KEY = 'notasapp_v1_libreta';
var NOTASPROPIO_KEY = 'notasapp_v1_propio';
var ORDER_KEYS = { notas: 'notasapp_v1_order_notas', info: 'notasapp_v1_order_info' };

var ENTITY_MAP = {
  'BBVA':'ce-bbva',
  'CAJAMAR':'ce-cajamar',
  'CAIXA RURAL TORRENT':'ce-caixa','CAIXA':'ce-caixa','CAIXA TORRENT':'ce-caixa',
  'ORANGE':'ce-orange',
  'ABANCA':'ce-abanca',
  'REPSOL':'ce-repsol','CAMPSA':'ce-repsol',
  'SPRINTER':'ce-sprinter',
  'DIA':'ce-dia',
  'BANCA MARCH':'ce-march',
  'JD':'ce-jd'
};

/* ===================== UTILIDADES DE TEXTO ===================== */
function limpiarTexto(raw){
  if(raw === null || raw === undefined) return '';
  var s = String(raw);
  s = s.replace(/(_x000d_)+/gi, '\n');
  s = s.replace(/\\n/g, '\n');
  s = s.replace(/<\/(p|div|li|h[1-6])>/gi, '\n');
  s = s.replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/<li[^>]*>/gi, '• ');
  s = s.replace(/<[^>]+>/g, '');
  s = s.replace(/&nbsp;/gi, ' ')
       .replace(/&amp;/gi, '&')
       .replace(/&lt;/gi, '<')
       .replace(/&gt;/gi, '>')
       .replace(/&quot;/gi, '"')
       .replace(/&#39;/gi, "'");
  s = s.split('\n').map(function(l){ return l.replace(/\s+$/,''); }).join('\n');
  s = s.replace(/\n{3,}/g, '\n\n');
  s = s.replace(/[ \t]{2,}/g, ' ');
  return s.trim();
}

function excelFecha(val){
  if(val === null || val === undefined || val === '') return '';
  if(typeof val === 'number'){
    try{
      var d = XLSX.SSF.parse_date_code(val);
      if(d && d.y) return pad2(d.d) + '/' + pad2(d.m) + '/' + d.y;
    }catch(e){}
  }
  return String(val).trim();
}
function pad2(n){ n = String(n); return n.length < 2 ? '0'+n : n; }

function todayStr(){
  var d = new Date();
  return pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '/' + d.getFullYear();
}

function fechaOrden(str){
  if(!str) return 0;
  var m = String(str).match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    var d = +m[1], mo = +m[2], y = +m[3];
    if(y < 100) y += 2000;
    return new Date(y, mo-1, d).getTime();
  }
  return 0;
}

function splitEtiquetas(str){
  if(!str) return [];
  return String(str).split(/[\s,]+/).map(function(s){
    return s.replace(/^#/, '').trim();
  }).filter(Boolean);
}

function entityClass(entidad){
  if(!entidad) return '';
  var key = String(entidad).trim().toUpperCase();
  return ENTITY_MAP[key] || '';
}

function escapeHtml(str){
  var d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function generarId(kind){
  return (kind === 'notas' ? 'N_' : 'IT_') + Date.now();
}

/* ===================== FORMATO DE NOTAS (HTML de Libreta) ===================== */
// Libreta guarda el texto de las notas como HTML de Quill (negrita, cursiva, tamaños...).
// Se conserva ese HTML, pero limpio: solo etiquetas de formato, sin scripts ni atributos raros.
var TAGS_PERMITIDAS = { B:1, STRONG:1, I:1, EM:1, U:1, S:1, STRIKE:1, DEL:1, BR:1, P:1, DIV:1,
  UL:1, OL:1, LI:1, SPAN:1, H1:1, H2:1, H3:1, BLOCKQUOTE:1, PRE:1, CODE:1 };
var TAGS_FUERA = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|TITLE|NOSCRIPT|TEMPLATE)$/;

function limpiarNodo(node){
  Array.prototype.slice.call(node.childNodes).forEach(function(ch){
    if(ch.nodeType === 8){ ch.remove(); return; }
    if(ch.nodeType !== 1) return;
    if(TAGS_FUERA.test(ch.tagName)){ ch.remove(); return; }
    limpiarNodo(ch);
    if(!TAGS_PERMITIDAS[ch.tagName]){
      while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild, ch);
      ch.remove();
      return;
    }
    Array.prototype.slice.call(ch.attributes).forEach(function(a){
      if(a.name === 'class'){
        var cls = a.value.split(/\s+/).filter(function(c){ return /^ql-(size|font|align|indent)-[a-z0-9]+$/.test(c); }).join(' ');
        if(cls) ch.setAttribute('class', cls); else ch.removeAttribute('class');
      } else if(!(a.name === 'data-list' && ch.tagName === 'LI')){
        ch.removeAttribute(a.name);
      }
    });
  });
}
function sanitizeHtml(html){
  var tpl = document.createElement('template');
  tpl.innerHTML = String(html == null ? '' : html).replace(/(_x000d_)+/gi, '');
  limpiarNodo(tpl.content);
  return tpl.innerHTML.trim();
}
function esHtml(str){
  return /<\/?(p|br|div|b|strong|i|em|u|s|strike|span|ul|ol|li|h[1-6])\b[^>]*>/i.test(String(str || ''));
}
function textoNotaImportado(raw){
  if(raw === null || raw === undefined) return '';
  var s = String(raw);
  return esHtml(s) ? sanitizeHtml(s) : limpiarTexto(s);
}
// HTML listo para pintar (sirve para texto plano antiguo y para HTML de Libreta)
function contenidoHtml(texto){
  if(!texto) return '';
  if(esHtml(texto)) return sanitizeHtml(texto);
  return escapeHtml(texto).replace(/\n/g, '<br>');
}
// Texto plano (para buscar y para detectar listas)
function textoPlano(texto){
  return limpiarTexto(texto || '');
}
// Nota de tipo lista: todas sus líneas empiezan por ☐ o ☑
function parseLista(texto){
  var lineas = textoPlano(texto).split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  if(!lineas.length) return null;
  var items = [];
  for(var i=0; i<lineas.length; i++){
    var m = lineas[i].match(/^([☐☑])\s?(.*)$/);
    if(!m) return null;
    items.push({ txt: m[2], ok: m[1] === '☑' });
  }
  return items;
}
function listaAHtml(items){
  return items.filter(function(i){ return i.txt && i.txt.trim(); }).map(function(i){
    return '<p>' + (i.ok ? '☑' : '☐') + ' ' + escapeHtml(i.txt.trim()) + '</p>';
  }).join('');
}
var MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaCorta(str){
  var m = String(str || '').match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(!m) return str || '';
  var y = +m[3]; if(y < 100) y += 2000;
  var out = (+m[1]) + ' ' + (MESES_C[(+m[2]) - 1] || m[2]);
  if(y !== new Date().getFullYear()) out += ' ' + String(y).slice(-2);
  return out;
}

/* ===================== COLOR / FIJADA (solo en este dispositivo) ===================== */
// Se guardan aparte, por id, para no cambiar el formato del Excel que se comparte con Libreta.
var META_KEY = 'notasapp_v1_meta_notas';
var COLORES_NOTA = ['bone','sage','arena','rosa','cielo','lila','menta','ocre'];
var META = {};
function cargarMeta(){ try{ META = JSON.parse(localStorage.getItem(META_KEY) || '{}') || {}; }catch(e){ META = {}; } }
function guardarMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(META)); }catch(e){} }
function metaDe(id){ return META[id] || {}; }
function setMeta(id, cambios){
  var m = META[id] || {};
  Object.keys(cambios).forEach(function(k){ m[k] = cambios[k]; });
  if(m.color === 'bone') delete m.color;
  if(!m.fija) delete m.fija;
  if(Object.keys(m).length) META[id] = m; else delete META[id];
  guardarMeta();
}

/* ===================== TEMA ===================== */
var THEME_KEY = 'notasapp_v1_theme';
function aplicarTema(t){
  if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  var mt = document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', t === 'light' ? '#F2F5F0' : '#14181F');
}
function toggleTheme(){
  var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  aplicarTema(t);
}

/* ===================== LECTURA DE EXCEL ===================== */
var HEADER_SETS = {
  notas: ['ID','TITULO','TEXTO','FECHA','ETIQUETAS'],
  info:  ['ID','FECHA','ENTIDAD','CODIGO','POBLACION','SISTEMA','TIPO_DATO','INFORMACION','ETIQUETAS']
};

function encontrarFilaCabecera(rows, headerSet){
  var maxRow = Math.min(rows.length, 10);
  var best = -1, bestScore = 0;
  for(var i=0; i<maxRow; i++){
    var row = rows[i] || [];
    var score = 0;
    for(var j=0; j<row.length; j++){
      var v = row[j];
      if(v === null || v === undefined) continue;
      var vv = String(v).trim().toUpperCase();
      if(headerSet.indexOf(vv) !== -1) score++;
    }
    if(score > bestScore){ bestScore = score; best = i; }
  }
  return bestScore >= 2 ? best : -1;
}

function filasAObjetos(rows, headerRowIdx){
  var headerRow = rows[headerRowIdx];
  var headers = headerRow.map(function(h){ return h === null || h === undefined ? '' : String(h).trim().toUpperCase(); });
  var out = [];
  for(var i = headerRowIdx + 1; i < rows.length; i++){
    var row = rows[i];
    if(!row || row.length === 0) continue;
    var obj = {};
    var hasAny = false;
    for(var j=0; j<headers.length; j++){
      if(!headers[j]) continue;
      var val = row[j];
      if(val !== null && val !== undefined && String(val).trim() !== '') hasAny = true;
      obj[headers[j]] = val;
    }
    if(hasAny) out.push(obj);
  }
  return out;
}

function procesarLibro(workbook){
  var notas = [];
  var info = [];

  if(workbook.Sheets['Notas']){
    var rowsN = XLSX.utils.sheet_to_json(workbook.Sheets['Notas'], {header:1, raw:true, defval:null});
    var hIdxN = encontrarFilaCabecera(rowsN, HEADER_SETS.notas);
    if(hIdxN !== -1){
      var objsN = filasAObjetos(rowsN, hIdxN);
      notas = objsN.filter(function(o){ return o.ID; }).map(function(o){
        return {
          id: String(o.ID),
          titulo: limpiarTexto(o.TITULO || ''),
          texto: textoNotaImportado(o.TEXTO),
          fecha: excelFecha(o.FECHA),
          etiquetas: splitEtiquetas(o.ETIQUETAS)
        };
      });
    }
  }

  if(workbook.Sheets['Información'] || workbook.Sheets['Informacion']){
    var sheetInfo = workbook.Sheets['Información'] || workbook.Sheets['Informacion'];
    var rowsI = XLSX.utils.sheet_to_json(sheetInfo, {header:1, raw:true, defval:null});
    var hIdxI = encontrarFilaCabecera(rowsI, HEADER_SETS.info);
    if(hIdxI !== -1){
      var objsI = filasAObjetos(rowsI, hIdxI);
      info = objsI.filter(function(o){ return o.ID; }).map(function(o){
        return {
          id: String(o.ID),
          fecha: excelFecha(o.FECHA),
          entidad: (o.ENTIDAD || '').toString().trim(),
          codigo: (o.CODIGO === null || o.CODIGO === undefined) ? '' : String(o.CODIGO).trim(),
          poblacion: (o.POBLACION || '').toString().trim(),
          sistema: (o.SISTEMA || '').toString().trim(),
          tipoDato: limpiarTexto(o.TIPO_DATO || ''),
          informacion: textoNotaImportado(o.INFORMACION),
          etiquetas: splitEtiquetas(o.ETIQUETAS)
        };
      });
    }
  }

  notas.sort(function(a,b){ return fechaOrden(b.fecha) - fechaOrden(a.fecha); });
  info.sort(function(a,b){ return fechaOrden(b.fecha) - fechaOrden(a.fecha); });

  return { notas: notas, info: info, updated: new Date().toISOString() };
}

function procesarLibroPropio(workbook){
  var parsed = procesarLibro(workbook);
  var notasMap = {};
  parsed.notas.forEach(function(n){ notasMap[n.id] = n; });
  var infoMap = {};
  parsed.info.forEach(function(n){ infoMap[n.id] = n; });
  return { notas: notasMap, info: infoMap, updated: parsed.updated };
}

/* ===================== FUSIÓN DE CAPAS ===================== */
function getMerged(kind){
  var base = (kind === 'notas' ? LIBRETA.notas : LIBRETA.info) || [];
  var propio = (kind === 'notas' ? NOTAS_PROPIO.notas : NOTAS_PROPIO.info) || {};
  var map = {};
  base.forEach(function(it){ map[it.id] = it; });
  Object.keys(propio).forEach(function(id){ map[id] = propio[id]; });
  var list = Object.keys(map).map(function(id){ return map[id]; });
  list.sort(function(a,b){ return fechaOrden(b.fecha) - fechaOrden(a.fecha); });
  return list;
}
function esLocal(kind, id){
  var propio = (kind === 'notas' ? NOTAS_PROPIO.notas : NOTAS_PROPIO.info) || {};
  return Object.prototype.hasOwnProperty.call(propio, id);
}
function existeEnLibreta(kind, id){
  var base = (kind === 'notas' ? LIBRETA.notas : LIBRETA.info) || [];
  return base.some(function(it){ return it.id === id; });
}

/* ===================== CARGA / GUARDADO ===================== */
function saveLibreta(){
  try{ localStorage.setItem(LIBRETA_KEY, JSON.stringify(LIBRETA)); }catch(e){}
}
function saveNotasPropio(){
  try{ localStorage.setItem(NOTASPROPIO_KEY, JSON.stringify(NOTAS_PROPIO)); }catch(e){}
}
function cargarDesdeStorage(){
  try{
    var raw = localStorage.getItem(LIBRETA_KEY);
    if(raw) LIBRETA = JSON.parse(raw);
  }catch(e){}
  try{
    var raw2 = localStorage.getItem(NOTASPROPIO_KEY);
    if(raw2) NOTAS_PROPIO = JSON.parse(raw2);
  }catch(e){}
}

document.getElementById('fileInputLibreta').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var arr = new Uint8Array(ev.target.result);
      var wb = XLSX.read(arr, {type:'array', cellDates:false});
      LIBRETA = procesarLibro(wb);
      saveLibreta();
      STATE.subEntidad = 'Todo';
      closeExcelModal();
      render();
    }catch(err){
      alert('No se pudo leer el Excel: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

document.getElementById('fileInputPropio').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var arr = new Uint8Array(ev.target.result);
      var wb = XLSX.read(arr, {type:'array', cellDates:false});
      NOTAS_PROPIO = procesarLibroPropio(wb);
      saveNotasPropio();
      STATE.subEntidad = 'Todo';
      closeExcelModal();
      render();
    }catch(err){
      alert('No se pudo leer el Excel: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

function todayStamp(){
  var d = new Date();
  return d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate());
}

function exportarExcelPropio(){
  var notasArr = getMerged('notas');
  var infoArr = getMerged('info');
  if(notasArr.length === 0 && infoArr.length === 0){
    alert('No hay datos cargados para exportar.');
    return;
  }
  var wsNotasData = [['ID','TITULO','TEXTO','FECHA','ETIQUETAS']];
  notasArr.forEach(function(n){
    wsNotasData.push([n.id, n.titulo || '', n.texto || '', n.fecha || '', (n.etiquetas||[]).map(function(t){ return '#'+t; }).join(' ')]);
  });
  var wsInfoData = [['ID','FECHA','ENTIDAD','CODIGO','POBLACION','SISTEMA','TIPO_DATO','INFORMACION','ETIQUETAS']];
  infoArr.forEach(function(it){
    wsInfoData.push([it.id, it.fecha || '', it.entidad || '', it.codigo || '', it.poblacion || '', it.sistema || '', it.tipoDato || '', it.informacion || '', (it.etiquetas||[]).map(function(t){ return '#'+t; }).join(' ')]);
  });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsNotasData), 'Notas');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsInfoData), 'Información');
  XLSX.writeFile(wb, 'notas_completo_' + todayStamp() + '.xlsx');
  closeExcelModal();
}

/* ===================== MODAL EXCEL ===================== */
function openExcelModal(){
  closeExcelModal();
  var bg = document.createElement('div');
  bg.className = 'excel-modal-bg';
  bg.id = 'excelModalBg';
  bg.onclick = function(e){ if(e.target === bg) closeExcelModal(); };
  bg.innerHTML =
    '<div class="excel-modal">' +
      '<h3>EXCEL</h3>' +

/* ===================== ORDEN MANUAL ===================== */
function loadOrder(kind){
  try{
    var raw = localStorage.getItem(ORDER_KEYS[kind]);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveOrder(kind, ids){
  try{ localStorage.setItem(ORDER_KEYS[kind], JSON.stringify(ids)); }catch(e){}
}
function ordenarManual(kind, list){
  var order = loadOrder(kind);
  if(!order.length) return list.slice();
  var byId = {};
  list.forEach(function(n){ byId[n.id] = n; });
  var ordered = [];
  order.forEach(function(id){
    if(byId[id]){ ordered.push(byId[id]); delete byId[id]; }
  });
  var nuevos = list.filter(function(n){ return byId[n.id]; });
  return nuevos.concat(ordered);
}

function initDragReorder(kind){
  var handles = document.querySelectorAll('.drag-handle');
  handles.forEach(function(handle){
    handle.addEventListener('pointerdown', function(e){ onDragStart(e, kind); });
  });
}

function onDragStart(e, kind){
  e.preventDefault();
  var row = e.target.closest('.note-row');
  if(!row) return;
  var list = row.parentElement;
  var rect = row.getBoundingClientRect();
  var startY = e.clientY;
  var startTop = rect.top;

  var placeholder = document.createElement('div');
  placeholder.className = 'note-row-placeholder';
  placeholder.style.height = rect.height + 'px';
  list.insertBefore(placeholder, row.nextSibling);

  row.style.position = 'fixed';
  row.style.top = rect.top + 'px';
  row.style.left = rect.left + 'px';
  row.style.width = rect.width + 'px';
  row.style.zIndex = 200;
  row.classList.add('dragging');
  document.body.style.userSelect = 'none';

  function onMove(ev){
    var y = ev.clientY;
    row.style.top = (startTop + (y - startY)) + 'px';
    var rowRect = row.getBoundingClientRect();
    var rowCenter = rowRect.top + rowRect.height / 2;
    var siblings = Array.prototype.slice.call(list.children).filter(function(el){ return el !== row && el !== placeholder; });
    var target = null;
    for(var i=0; i<siblings.length; i++){
      var sr = siblings[i].getBoundingClientRect();
      if(rowCenter < sr.top + sr.height / 2){ target = siblings[i]; break; }
    }
    if(target){
      if(target !== placeholder.nextSibling) list.insertBefore(placeholder, target);
    } else {
      if(list.lastElementChild !== placeholder) list.appendChild(placeholder);
    }
  }

  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    row.style.position = '';
    row.style.top = '';
    row.style.left = '';
    row.style.width = '';
    row.style.zIndex = '';
    row.classList.remove('dragging');
    document.body.style.userSelect = '';
    list.insertBefore(row, placeholder);
    placeholder.remove();

    var visibleIds = Array.prototype.slice.call(list.children).map(function(el){ return el.dataset.id; });
    var fullOrder = loadOrder(kind);
    if(!fullOrder.length){
      fullOrder = getMerged(kind).map(function(n){ return String(n.id); });
    }
    var indices = [];
    visibleIds.forEach(function(id){
      var idx = fullOrder.indexOf(id);
      if(idx !== -1) indices.push(idx);
    });
    var insertPos = indices.length ? Math.min.apply(null, indices) : fullOrder.length;
    fullOrder = fullOrder.filter(function(id){ return visibleIds.indexOf(id) === -1; });
    if(insertPos > fullOrder.length) insertPos = fullOrder.length;
    var args = [insertPos, 0].concat(visibleIds);
    Array.prototype.splice.apply(fullOrder, args);
    saveOrder(kind, fullOrder);
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function cardHtml(kind, item){
  var cls = kind === 'info' ? entityClass(item.entidad) : '';
  var local = esLocal(kind, item.id);
  var titleLine, headLine, bodyText, dateStr, chips;

  if(kind === 'notas'){
    titleLine = item.titulo || '(sin título)';
    headLine = '';
    bodyText = item.texto;
    dateStr = item.fecha;
    chips = item.etiquetas;
  } else {
    var headParts = [];
    if(item.entidad) headParts.push(item.entidad.toUpperCase());
    titleLine = [item.poblacion, item.tipoDato].filter(Boolean).join(' · ') || item.tipoDato || '(sin título)';
    headLine = headParts.join(' ');
    bodyText = item.informacion;
    dateStr = item.fecha;
    chips = item.etiquetas;
    if(item.sistema) chips = [item.sistema].concat(chips);
  }

  var bodyEsc = contenidoHtml(bodyText || '');
  var cid = kind + '-' + item.id;

  var head = '';
  if(kind === 'info'){
    head = '<div class="head">' +
      (item.entidad ? '<span class="ent">' + escapeHtml(item.entidad.toUpperCase()) + '</span>' : '<span class="ent" style="color:var(--ink-dim)">SIN ENTIDAD</span>') +
      (item.codigo ? '<span class="code">' + escapeHtml(item.codigo) + '</span>' : '') +
      '</div>';
  }

  var out = '<div class="card ' + cls + '" data-cid="' + cid + '" onclick="openFullView(' + JSON.stringify(cid).replace(/"/g,'&quot;') + ')">';
  out += head;
  out += '<p class="title">' + escapeHtml(titleLine) + (local ? ' <span class="local-badge">✎</span>' : '') + '</p>';
  out += '<div class="body" id="body-' + cid + '">' + bodyEsc + '</div>';
  out += '<div class="meta"><span class="date">' + escapeHtml(dateStr || '') + '</span>';
  if(chips && chips.length){
    out += '<span class="chips">' + chips.slice(0,3).map(function(c){ return '<span class="chip">#' + escapeHtml(c) + '</span>'; }).join('') + '</span>';
  }
  out += '</div></div>';
  return out;
}

function eliminarItem(kind, id){
  var enLibreta = existeEnLibreta(kind, id);
  var msg = enLibreta
    ? 'Esta nota también existe en el Excel de Libreta. Se eliminará tu versión local y se volverá a mostrar la original de Libreta. ¿Continuar?'
    : '¿Eliminar esta nota? No se puede deshacer.';
  if(!confirm(msg)) return;

  var propio = (kind === 'notas' ? NOTAS_PROPIO.notas : NOTAS_PROPIO.info);
  if(propio && Object.prototype.hasOwnProperty.call(propio, id)) delete propio[id];
  if(kind === 'notas' && !enLibreta && META[id]){ delete META[id]; guardarMeta(); }
  if(kind === 'notas') NE = null;
  NOTAS_PROPIO.updated = new Date().toISOString();
  saveNotasPropio();

  document.querySelectorAll('.fullview').forEach(function(el){ el.remove(); });
  render();
}

function guardarEditor(kind, existingId){
  var val = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; };
  var etiquetas = splitEtiquetas(val('ed-etiquetas'));
  var id = existingId || generarId(kind);
  var item;

  if(kind === 'notas'){
    item = {
      id: id,
      titulo: val('ed-titulo'),
      texto: val('ed-texto'),
      fecha: val('ed-fecha') || todayStr(),
      etiquetas: etiquetas
    };
    if(!item.titulo && !item.texto){ alert('Escribe al menos un título o un texto.'); return; }
    NOTAS_PROPIO.notas[id] = item;
  } else {
    item = {
      id: id,
      fecha: val('ed-fecha') || todayStr(),
      entidad: val('ed-entidad'),
      codigo: val('ed-codigo'),
      poblacion: val('ed-poblacion'),
      sistema: val('ed-sistema'),
      tipoDato: val('ed-tipoDato'),
      informacion: val('ed-informacion'),
      etiquetas: etiquetas
    };
    var infoVacia = !item.entidad && !item.codigo && !item.poblacion && !item.sistema && !item.tipoDato && !item.informacion;
    if(infoVacia){ alert('Rellena al menos un campo antes de guardar.'); return; }
    NOTAS_PROPIO.info[id] = item;
  }

  NOTAS_PROPIO.updated = new Date().toISOString();
  saveNotasPropio();

  var el = document.getElementById('editorView');
  if(el) el.remove();
  render();
}

function render(){
  document.getElementById('updatedLabel').textContent = formatUpdated();
  renderSubtabs();

  var contentEl = document.getElementById('content');
  var totalItems = getMerged('notas').length + getMerged('info').length;

  if(totalItems === 0){
    contentEl.innerHTML =
      '<div class="empty">' +
      '<div class="icon">🗒️</div>' +
      '<h2>Sin datos cargados</h2>' +
      '<p>Importa el Excel de PycLibreta (hojas "Notas" e "Información")<br>o crea tu primera nota con el botón +.</p>' +
      '<button class="bigbtn" onclick="openExcelModal()">Abrir Excel</button>' +
      '</div>';
    return;
  }

  CARD_STORE = {};
  if(STATE.mainTab === 'notas'){
    renderNotas(contentEl);
    return;
  }
  var items, kind;
  var reorderActive = false;
  {
    kind = 'info';
    items = getMerged('info').filter(function(n){
      if(STATE.subEntidad !== 'Todo' && (n.entidad || '') !== STATE.subEntidad) return false;
      return matchQuery([n.entidad, n.codigo, n.poblacion, n.sistema, n.tipoDato, textoPlano(n.informacion), n.etiquetas.join(' ')]);
    });
    items = ordenarManual('info', items);
    reorderActive = (!STATE.query && items.length > 1);
  }

  if(items.length === 0){
    contentEl.innerHTML = '<div class="no-results">Sin resultados para esta búsqueda.</div>';
    return;
  }

  var html = '<div class="notas-list">';
  items.forEach(function(item){
    var cid = kind + '-' + item.id;
    var local = esLocal(kind, item.id);
    if(kind === 'notas'){
      CARD_STORE[cid] = {
        kind: kind, id: item.id, raw: item, isLocal: local,
        title: item.titulo || '(sin título)',
        body: item.texto,
        ent: '', sub: '',
        date: item.fecha,
        chips: item.etiquetas
      };
    } else {
      var chips = item.sistema ? [item.sistema].concat(item.etiquetas) : item.etiquetas;
      CARD_STORE[cid] = {
        kind: kind, id: item.id, raw: item, isLocal: local,
        title: [item.poblacion, item.tipoDato].filter(Boolean).join(' · ') || item.tipoDato || '(sin título)',
        body: item.informacion,
        ent: item.entidad ? item.entidad.toUpperCase() : '',
        sub: item.codigo || '',
        date: item.fecha,
        chips: chips
      };
    }
    html += '<div class="note-row" data-id="' + escapeHtml(String(item.id)) + '">';
    if(reorderActive) html += '<div class="drag-handle">⠿</div>';
    html += cardHtml(kind, item);
    html += '</div>';
  });
  html += '</div>';
  contentEl.innerHTML = html;

  if(reorderActive) initDragReorder(kind);
}

  var todas = getMerged('notas');
  todas.forEach(function(n){ NOTA_INDEX[n.id] = n; });
  var items = todas.filter(function(n){
    if(STATE.subEtiqueta !== 'Todas' && (n.etiquetas || []).indexOf(STATE.subEtiqueta) === -1) return false;
    return matchQuery([n.titulo, textoPlano(n.texto), (n.etiquetas || []).join(' ')]);
  });
  if(items.length === 0){
    contentEl.innerHTML = '<div class="no-results">' + (STATE.query ? 'Sin resultados para esta búsqueda.' : 'No hay notas.') + '</div>';
    return;
  }
  items = ordenarManual('notas', items);
  var reorder = !STATE.query && items.length > 1;
  var fijas = items.filter(function(n){ return metaDe(n.id).fija; });
  var resto = items.filter(function(n){ return !metaDe(n.id).fija; });
  var html = '';
  if(fijas.length){
    html += '<div class="n-seccion">Fijadas</div><div class="mosaico">' + fijas.map(function(n){ return tarjetaNota(n, reorder); }).join('') + '</div>';
    if(resto.length) html += '<div class="n-seccion">Otras</div>';
  }
  if(resto.length) html += '<div class="mosaico">' + resto.map(function(n){ return tarjetaNota(n, reorder); }).join('') + '</div>';
  contentEl.innerHTML = html;
  packMosaic();
  if(reorder){
    contentEl.querySelectorAll('.n-asa').forEach(function(h){ h.addEventListener('pointerdown', startNotaDrag); });
  }
}

// Calcula cuántas filas ocupa cada tarjeta para que el mosaico quede sin huecos
function packMosaic(){
  document.querySelectorAll('.mosaico .nwrap').forEach(function(w){
    var nota = w.firstElementChild;
    if(!nota) return;
    var t = nota.querySelector('.n-txt');
    if(t) t.classList.toggle('corta', t.scrollHeight > t.clientHeight + 2);
    w.style.gridRowEnd = 'span ' + Math.max(1, Math.ceil((nota.getBoundingClientRect().height + 10) / 2));
  });
}
var _packTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(_packTimer);
  _packTimer = setTimeout(packMosaic, 120);
});

// Clicks en las tarjetas de notas (abrir, fijar, marcar casilla, filtrar por etiqueta)
document.getElementById('content').addEventListener('click', function(e){
  if(STATE.mainTab !== 'notas') return;
  var t = e.target;
  if(t.closest('.n-asa')) return;
  var nota = t.closest('[data-open]');
  if(!nota) return;
  var id = nota.getAttribute('data-open');
  var pin = t.closest('[data-pin]');
  if(pin){
    setMeta(id, { fija: !metaDe(id).fija });
    render();
    return;
  }
  var chk = t.closest('[data-chk]');
  if(chk){
    marcarItemTarjeta(id, +chk.getAttribute('data-chk'));
    return;
  }
  var tag = t.closest('[data-tag]');
  if(tag){
    setEtiqueta(tag.getAttribute('data-tag'));
    return;
  }
  if(NOTA_INDEX[id]) openNotaEditor(NOTA_INDEX[id]);
});

function marcarItemTarjeta(id, idx){
  var n = NOTA_INDEX[id];
  if(!n) return;
  var lista = parseLista(n.texto);
  if(!lista || !lista[idx]) return;
  lista[idx].ok = !lista[idx].ok;
  var copia = {};
  Object.keys(n).forEach(function(k){ copia[k] = n[k]; });
  copia.texto = listaAHtml(lista);
  NOTAS_PROPIO.notas[id] = copia;
  NOTAS_PROPIO.updated = new Date().toISOString();
  saveNotasPropio();
  render();
}

/* ===================== NOTAS: ARRASTRAR PARA ORDENAR ===================== */
function startNotaDrag(e){
  e.preventDefault();
  e.stopPropagation();
  var wrap = e.currentTarget.closest('.nwrap');
  if(!wrap) return;
  var grid = wrap.parentElement;
  var nota = wrap.firstElementChild;
  var destino = null;
  nota.classList.add('llevando');
  document.body.style.userSelect = 'none';

  function limpiarDestino(){
    if(destino) destino.firstElementChild.classList.remove('destino');
    destino = null;
  }
  function onMove(ev){
    if(ev.clientY < 90) window.scrollBy(0, -10);
    else if(ev.clientY > window.innerHeight - 60) window.scrollBy(0, 10);
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var w = el && el.closest ? el.closest('.nwrap') : null;
    if(w && w !== wrap && w.parentElement === grid){
      if(w !== destino){
        limpiarDestino();
        destino = w;
        w.firstElementChild.classList.add('destino');
      }
    } else {
      limpiarDestino();
    }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    nota.classList.remove('llevando');
    document.body.style.userSelect = '';
    if(destino){
      var kids = Array.prototype.slice.call(grid.children);
      var from = kids.indexOf(wrap), to = kids.indexOf(destino);
      if(from < to) grid.insertBefore(wrap, destino.nextSibling);
      else grid.insertBefore(wrap, destino);
      limpiarDestino();
      guardarOrdenNotasDesdeDom();
      packMosaic();
    }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

// Mismo criterio que el orden manual existente: las notas visibles se recolocan
// en el orden completo sin tocar la posición de las que están ocultas por el filtro.
function guardarOrdenNotasDesdeDom(){
  var visibleIds = Array.prototype.slice.call(document.querySelectorAll('#content .nwrap')).map(function(el){ return el.dataset.id; });
  var fullOrder = loadOrder('notas');
  if(!fullOrder.length){
    fullOrder = ordenarManual('notas', getMerged('notas')).map(function(n){ return String(n.id); });
  }
  getMerged('notas').forEach(function(n){
    if(fullOrder.indexOf(String(n.id)) === -1) fullOrder.unshift(String(n.id));
  });
  var indices = [];
  visibleIds.forEach(function(id){
    var idx = fullOrder.indexOf(id);
    if(idx !== -1) indices.push(idx);
  });
  var insertPos = indices.length ? Math.min.apply(null, indices) : 0;
  fullOrder = fullOrder.filter(function(id){ return visibleIds.indexOf(id) === -1; });
  if(insertPos > fullOrder.length) insertPos = fullOrder.length;
  Array.prototype.splice.apply(fullOrder, [insertPos, 0].concat(visibleIds));
  saveOrder('notas', fullOrder);
}

/* ===================== NOTAS: EDITOR A PANTALLA COMPLETA ===================== */
var NE = null;

function openNotaEditor(existing){
  var n = existing || null;
  var meta = n ? metaDe(n.id) : {};
  var lista = n ? parseLista(n.texto) : null;
  NE = {
    original: n,
    isNew: !n,
    dirty: false,
    lista: !!lista,
    items: lista || [],
    color: COLORES_NOTA.indexOf(meta.color) !== -1 ? meta.color : 'bone',
    fija: !!meta.fija,
    metaCambiada: false
  };
  var puedeBorrar = n && esLocal('notas', n.id);

  var fv = document.createElement('div');
  fv.className = 'fullview neditor';
  fv.id = 'editorView';
  fv.style.background = 'var(--nc-' + NE.color + ')';
  fv.innerHTML =
    '<div class="ne-top">' +
      '<button class="ne-ico" data-a="back" aria-label="Volver">←</button>' +
      '<span class="ne-sp"></span>' +
      '<button class="ne-ico" data-a="lista" aria-pressed="' + NE.lista + '" aria-label="Lista con casillas">☑</button>' +
      '<button class="ne-ico" data-a="pin" aria-pressed="' + NE.fija + '" aria-label="Fijar">' + ICO_PIN + '</button>' +
      (puedeBorrar ? '<button class="ne-ico borrar" data-a="del" aria-label="Borrar">🗑</button>' : '') +
      '<button class="ne-ico ok" data-a="save" aria-label="Guardar">✓</button>' +
    '</div>' +
    '<input class="ne-tit" id="neTit" placeholder="Título" value="' + escapeHtml(n ? n.titulo : '') + '">' +
    '<div class="ne-tools" id="neTools">' +
      '<button class="b" data-cmd="bold">B</button>' +
      '<button class="i" data-cmd="italic">I</button>' +
      '<button class="u" data-cmd="underline">U</button>' +
      '<button class="s" data-cmd="strikeThrough">S</button>' +
      '<span class="ne-sepv"></span>' +
      '<button data-cmd="insertUnorderedList">• —</button>' +
      '<button data-cmd="insertOrderedList">1.</button>' +
    '</div>' +
    '<div class="ne-body" id="neBody" contenteditable="true" data-ph="Escribe aquí…"></div>' +
    '<div class="ne-items" id="neItems"></div>' +
    '<div class="ne-foot">' +
      '<input id="neTags" placeholder="#etiquetas" value="' + escapeHtml(n ? (n.etiquetas || []).map(function(t){ return '#' + t; }).join(' ') : '') + '">' +
      '<input id="neFecha" placeholder="dd/mm/aaaa" value="' + escapeHtml(n ? (n.fecha || '') : todayStr()) + '">' +
      '<div class="ne-cols" id="neCols">' + COLORES_NOTA.map(function(c){
        return '<button data-c="' + c + '" aria-pressed="' + (NE.color === c) + '" style="background:var(--nc-' + c + ')" aria-label="' + c + '"></button>';
      }).join('') + '</div>' +
    '</div>';
  document.body.appendChild(fv);

  var body = document.getElementById('neBody');
  if(!NE.lista && n) body.innerHTML = contenidoHtml(n.texto);
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}
  pintarModoNE();

  var marcar = function(){ NE.dirty = true; };
  document.getElementById('neTit').addEventListener('input', marcar);
  body.addEventListener('input', marcar);
  document.getElementById('neTags').addEventListener('input', marcar);
  document.getElementById('neFecha').addEventListener('input', marcar);

  // Botones de formato: no quitan el foco del texto
  fv.querySelectorAll('[data-cmd]').forEach(function(b){
    b.addEventListener('pointerdown', function(ev){ ev.preventDefault(); });
    b.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
    b.addEventListener('click', function(){
      document.execCommand(b.getAttribute('data-cmd'), false, null);
      NE.dirty = true;
    });
  });
  fv.querySelectorAll('#neCols [data-c]').forEach(function(b){
    b.addEventListener('click', function(){
      NE.color = b.getAttribute('data-c');
      NE.metaCambiada = true;
      fv.style.background = 'var(--nc-' + NE.color + ')';
      fv.querySelectorAll('#neCols [data-c]').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    });
  });
  fv.querySelector('.ne-top').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-a]');
    if(!b) return;
    var a = b.getAttribute('data-a');
    if(a === 'back' || a === 'save') cerrarNotaEditor(true);
    else if(a === 'pin'){
      NE.fija = !NE.fija; NE.metaCambiada = true;
      b.setAttribute('aria-pressed', NE.fija ? 'true' : 'false');
    }
    else if(a === 'lista') cambiarModoListaNE(b);
    else if(a === 'del') eliminarItem('notas', NE.original.id);
  });

  if(!n) setTimeout(function(){ var t = document.getElementById('neTit'); if(t) t.focus(); }, 60);
}

function pintarModoNE(){
  var body = document.getElementById('neBody');
  var tools = document.getElementById('neTools');
  var cont = document.getElementById('neItems');
  if(NE.lista){
    body.style.display = 'none';
    tools.style.display = 'none';
    cont.style.display = '';
    pintarItemsNE();
  } else {
    body.style.display = '';
    tools.style.display = '';
    cont.style.display = 'none';
    cont.innerHTML = '';
  }
}

function pintarItemsNE(focusIdx){
  var cont = document.getElementById('neItems');
  cont.innerHTML = NE.items.map(function(it, i){
    return '<div class="it-fila' + (it.ok ? ' ok' : '') + '" data-i="' + i + '">' +
      '<button class="caja" data-k="chk">' + (it.ok ? '✓' : '') + '</button>' +
      '<input value="' + escapeHtml(it.txt) + '" placeholder="Elemento">' +
      '<button class="it-quitar" data-k="del" aria-label="Quitar">✕</button>' +
    '</div>';
  }).join('') + '<button class="it-add" data-k="add"><b>+</b> Añadir elemento</button>';

  cont.querySelectorAll('.it-fila').forEach(function(f){
    var i = +f.getAttribute('data-i');
    var inp = f.querySelector('input');
    inp.addEventListener('input', function(){ NE.items[i].txt = inp.value; NE.dirty = true; });
    inp.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter'){
        ev.preventDefault();
        NE.items.splice(i + 1, 0, { txt: '', ok: false });
        NE.dirty = true;
        pintarItemsNE(i + 1);
      } else if(ev.key === 'Backspace' && inp.value === '' && NE.items.length > 1){
        ev.preventDefault();
        NE.items.splice(i, 1);
        NE.dirty = true;
        pintarItemsNE(Math.max(0, i - 1));
      }
    });
    f.querySelector('[data-k="chk"]').addEventListener('click', function(){
      NE.items[i].ok = !NE.items[i].ok; NE.dirty = true; pintarItemsNE();
    });
    f.querySelector('[data-k="del"]').addEventListener('click', function(){
      NE.items.splice(i, 1); NE.dirty = true; pintarItemsNE();
    });
  });
  cont.querySelector('[data-k="add"]').addEventListener('click', function(){
    NE.items.push({ txt: '', ok: false }); NE.dirty = true; pintarItemsNE(NE.items.length - 1);
  });
  if(focusIdx !== undefined){
    var target = cont.querySelectorAll('.it-fila input')[focusIdx];
    if(target) target.focus();
  }
}

function cambiarModoListaNE(btn){
  var body = document.getElementById('neBody');
  if(!NE.lista){
    var lineas = textoPlano(body.innerHTML).split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    NE.items = lineas.map(function(l){
      return { txt: l.replace(/^[•\-\*☐☑]\s*/, ''), ok: /^☑/.test(l) };
    });
    if(!NE.items.length) NE.items = [{ txt: '', ok: false }];
    NE.lista = true;
  } else {
    body.innerHTML = NE.items.filter(function(i){ return i.txt.trim(); }).map(function(i){
      return '<p>' + escapeHtml(i.txt.trim()) + '</p>';
    }).join('');
    NE.lista = false;
  }
  NE.dirty = true;
  btn.setAttribute('aria-pressed', NE.lista ? 'true' : 'false');
  pintarModoNE();
  if(NE.lista) pintarItemsNE(NE.items.length - 1);
}

function textoActualNE(){
  if(NE.lista) return listaAHtml(NE.items);
  var html = document.getElementById('neBody').innerHTML;
  if(!textoPlano(html)) return '';
  var limpio = sanitizeHtml(html);
  // Siempre como HTML (así Libreta lo interpreta igual y no se escapa dos veces)
  return esHtml(limpio) ? limpio : '<p>' + limpio + '</p>';
}

function cerrarNotaEditor(guardar){
  var fv = document.getElementById('editorView');
  if(!NE){ if(fv) fv.remove(); return; }
  var id = NE.original ? NE.original.id : null;

  if(guardar && (NE.dirty || NE.isNew)){
    var titulo = document.getElementById('neTit').value.trim();
    var texto = textoActualNE();
    if(NE.isNew && !titulo && !texto){
      // nota nueva vacía: se descarta sin preguntar
    } else if(NE.dirty){
      id = id || generarId('notas');
      var item = {};
      if(NE.original) Object.keys(NE.original).forEach(function(k){ item[k] = NE.original[k]; });
      item.id = id;
      item.titulo = titulo;
      item.texto = texto;
      item.fecha = document.getElementById('neFecha').value.trim() || todayStr();
      item.etiquetas = splitEtiquetas(document.getElementById('neTags').value);
      NOTAS_PROPIO.notas[id] = item;
      NOTAS_PROPIO.updated = new Date().toISOString();
      saveNotasPropio();
    } else {
      id = null;
    }
  }
  // Color y fijada se guardan aparte: no convierten una nota de Libreta en "editada"
  if(guardar && id && (NE.metaCambiada || NE.isNew)){
    setMeta(id, { color: NE.color, fija: NE.fija });
  }
  NE = null;
  if(fv) fv.remove();
  render();
}

/* ===================== INFORMACIÓN: EDITOR A PANTALLA COMPLETA ===================== */
var IE = null;

function openInfoEditor(existing){
  var it = existing || null;
  IE = { original: it, isNew: !it, dirty: false };
  var puedeBorrar = it && esLocal('info', it.id);
  var campo = function(id, label, value){
    return '<div class="ek-metafield"><label>' + label + '</label><input id="' + id + '" value="' + escapeHtml(value || '') + '" placeholder="—"></div>';
  };

  var fv = document.createElement('div');
  fv.className = 'fullview neditor';
  fv.id = 'editorView';
  fv.innerHTML =
    '<div class="ne-top">' +
      '<button class="ne-ico" data-a="back" aria-label="Volver">←</button>' +
      '<span class="ne-sp"></span>' +
      (puedeBorrar ? '<button class="ne-ico borrar" data-a="del" aria-label="Borrar">🗑</button>' : '') +
      '<button class="ne-ico ok" data-a="save" aria-label="Guardar">✓</button>' +
    '</div>' +
    '<div class="ne-tools">' +
      '<button class="b" data-cmd="bold">B</button>' +
      '<button class="i" data-cmd="italic">I</button>' +
      '<button class="u" data-cmd="underline">U</button>' +
      '<button class="s" data-cmd="strikeThrough">S</button>' +
      '<span class="ne-sepv"></span>' +
      '<button data-cmd="insertUnorderedList">• —</button>' +
      '<button data-cmd="insertOrderedList">1.</button>' +
    '</div>' +
    '<div class="ie-scroll">' +
      '<input class="ne-tit" id="ieTipo" placeholder="Tipo de dato (ej. Contraseña)" value="' + escapeHtml(it ? it.tipoDato : '') + '">' +
      campo('ieEntidad', 'Entidad', it ? it.entidad : '') +
      campo('ieCodigo', 'Código', it ? it.codigo : '') +
      campo('iePoblacion', 'Población', it ? it.poblacion : '') +
      campo('ieSistema', 'Sistema', it ? it.sistema : '') +
      '<div class="ne-body" id="ieBody" contenteditable="true" data-ph="Escribe la información aquí…"></div>' +
    '</div>' +
    '<div class="ne-foot">' +
      '<input id="ieTags" placeholder="#etiquetas" style="width:170px" value="' + escapeHtml(it ? (it.etiquetas || []).map(function(t){ return '#' + t; }).join(' ') : '') + '">' +
      '<input id="ieFecha" placeholder="dd/mm/aaaa" style="width:104px;font-family:var(--mono)" value="' + escapeHtml(it ? (it.fecha || '') : todayStr()) + '">' +
    '</div>';
  document.body.appendChild(fv);

  var body = document.getElementById('ieBody');
  if(it) body.innerHTML = contenidoHtml(it.informacion);
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}

  var marcar = function(){ IE.dirty = true; };
  ['ieTipo','ieEntidad','ieCodigo','iePoblacion','ieSistema','ieBody','ieTags','ieFecha'].forEach(function(id){
    document.getElementById(id).addEventListener('input', marcar);
  });
  fv.querySelectorAll('[data-cmd]').forEach(function(b){
    b.addEventListener('pointerdown', function(ev){ ev.preventDefault(); });
    b.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
    b.addEventListener('click', function(){
      document.execCommand(b.getAttribute('data-cmd'), false, null);
      IE.dirty = true;
    });
  });
  fv.querySelector('.ne-top').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-a]');
    if(!b) return;
    var a = b.getAttribute('data-a');
    if(a === 'back' || a === 'save') cerrarInfoEditor();
    else if(a === 'del'){ IE = null; eliminarItem('info', it.id); }
  });

  if(!it) setTimeout(function(){ var t = document.getElementById('ieTipo'); if(t) t.focus(); }, 60);
}

function cerrarInfoEditor(){
  var fv = document.getElementById('editorView');
  if(!IE){ if(fv) fv.remove(); return; }
  if(IE.dirty){
    var val = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; };
    var html = document.getElementById('ieBody').innerHTML;
    var informacion = '';
    if(textoPlano(html)){
      informacion = sanitizeHtml(html);
      if(!esHtml(informacion)) informacion = '<p>' + informacion + '</p>';
    }
    var item = {};
    if(IE.original) Object.keys(IE.original).forEach(function(k){ item[k] = IE.original[k]; });
    item.id = IE.original ? IE.original.id : generarId('info');
    item.fecha = val('ieFecha') || todayStr();
    item.entidad = val('ieEntidad');
    item.codigo = val('ieCodigo');
    item.poblacion = val('iePoblacion');
    item.sistema = val('ieSistema');
    item.tipoDato = val('ieTipo');
    item.informacion = informacion;
    item.etiquetas = splitEtiquetas(val('ieTags'));
    var vacia = !item.entidad && !item.codigo && !item.poblacion && !item.sistema && !item.tipoDato && !item.informacion;
    if(vacia && !IE.isNew){ alert('Rellena al menos un campo antes de guardar.'); return; }
    if(!vacia){
      NOTAS_PROPIO.info[item.id] = item;
      NOTAS_PROPIO.updated = new Date().toISOString();
      saveNotasPropio();
    }
  }
  IE = null;
  if(fv) fv.remove();
  render();
}

cargarDesdeStorage();
cargarMeta();

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
